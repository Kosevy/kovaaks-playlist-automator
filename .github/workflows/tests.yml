name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify compilation (py_compile)
        run: |
          python -m py_compile main.py core/*.py ui/*.py ui/tabs/*.py tests/*.py

      - name: Run Core Logic Unit Tests
        run: |
          python -m unittest tests/test_core_logic.py -v
