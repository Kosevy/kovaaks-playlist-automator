name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify compilation (py_compile)
        run: |
          python -m py_compile main.py core/*.py ui/*.py ui/tabs/*.py tests/*.py

      - name: Run Core Logic Unit Tests Gate
        run: |
          python -m unittest tests/test_core_logic.py -v

      - name: Build portable Windows executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --name "KPA-Windows-x64" main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KPA-Windows-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
